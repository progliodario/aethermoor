name: Bug report
description: Something does not work
labels: ["type:bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Linux, Android, All]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt or screenshot
      description: The log file is in the game's data folder. It contains no personal data.
