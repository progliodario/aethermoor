name: ci-data

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "project.json"
      - "examples/**"
      - "desktop/tests/**"
      - "desktop/vcpkg.json"
      - "android/core/src/test/**"
      - "android/**/*.kts"
      - "android/gradle/**"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/design/parity.md"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Lint tools
        run: ruff check tools
      - name: Validate data, schemas and localization
        run: python tools/validate_data.py
      - name: Validate the example mod (docs/modding/README.md)
        run: python tools/validate_data.py examples/mod-example
      - name: Tool tests
        run: pytest -q tools/tests
      - name: The committed conformance vectors are the ones the reference generates
        run: python tools/gen_conformance.py --check
      - name: A frozen save for every version of the save (spec 12, "Fixtures of the save")
        run: python tools/make_save_fixtures.py --check
      - name: Both clients run every suite of vectors (docs/design/parity.md)
        run: python tools/make_parity.py --check
      - name: Every category of conformance tests of the plan has its cases (docs/design/suites.md)
        run: python tools/make_suites_map.py --check
      - name: Every dependency has an allowed license (THIRD_PARTY_NOTICES.md)
        run: python tools/licenses.py --check
