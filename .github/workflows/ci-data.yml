name: ci-data

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "project.json"
      - ".github/workflows/ci-data.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Lint tools
        run: ruff check tools
      - name: Validate data, schemas and localization
        run: python tools/validate_data.py
      - name: Tool tests
        run: pytest -q tools/tests
      - name: The committed conformance vectors are the ones the reference generates
        run: python tools/gen_conformance.py --check
