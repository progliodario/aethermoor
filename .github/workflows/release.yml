name: release

# Drafts a GitHub release for a tag v*: it checks the data and creates the draft, without files yet.
# The CI already builds the test packages (Windows zip, Linux tar.gz, Android APK). Attaching them here,
# with checksums and signing, is item E3.1 of docs/plan/07-programma-operativo.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: Validate data before releasing
        run: python tools/validate_data.py
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "$GITHUB_REF_NAME"
