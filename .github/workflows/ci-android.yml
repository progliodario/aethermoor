name: ci-android

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "data/**"
      - "project.json"
      - ".github/workflows/ci-android.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - name: Unit tests (pure JVM core)
        working-directory: android
        run: gradle --no-daemon :core:test
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: aethermoor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # The style of the Kotlin (ktlint, with the rules of .editorconfig) and the checks of detekt (android/config/detekt.yml; the findings
  # of the code written before it came are in android/config/detekt-baseline.xml). See docs/dev/kotlin-style.md.
  kotlin-style:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Download ktlint and detekt
        run: |
          curl -sSfLo /tmp/ktlint https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x /tmp/ktlint
          curl -sSfLo /tmp/detekt.jar https://github.com/detekt/detekt/releases/download/v1.23.6/detekt-cli-1.23.6-all.jar
      - name: ktlint
        run: |
          set +e
          /tmp/ktlint --relative "android/**/*.kt" "android/**/*.kts" > ktlint.txt
          code=$?
          if [ $code -ne 0 ]; then
            head -n 300 ktlint.txt
            /tmp/ktlint --relative --format "android/**/*.kt" "android/**/*.kts" > ktlint-left.txt
            git diff > ktlint-format.patch
            echo "ktlint found problems: the artifact kotlin-style has the patch of --format and what it cannot fix (ktlint-left.txt)"
            exit 1
          fi
      - name: detekt
        if: success() || failure()
        run: |
          args=(--input android --excludes "**/build/**" --config android/config/detekt.yml --build-upon-default-config
                --baseline android/config/detekt-baseline.xml)
          if [ -f android/config/detekt-baseline.xml ]; then
            java -jar /tmp/detekt.jar "${args[@]}"
          else
            java -jar /tmp/detekt.jar "${args[@]}" --create-baseline
            echo "the baseline was written: it is in the artifact kotlin-style, commit it as android/config/detekt-baseline.xml"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: kotlin-style
          path: |
            ktlint.txt
            ktlint-left.txt
            ktlint-format.patch
            android/config/detekt-baseline.xml
          if-no-files-found: ignore
