name: nightly

# The checks too slow for every pull request (items C4.1 and C4.2 of docs/plan/07-programma-operativo.md; docs/design/performance.md):
# the game on an Android emulator of API 30 and of API 34 (android/app/src/androidTest: it starts and draws, turns, goes to the
# background and comes back, and it is still the same game), and the thread of the streaming of the desktop under ThreadSanitizer.
# It runs every night on main, on demand, and on a pull request that changes this workflow, the test on the emulator or the chunk
# store.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/nightly.yml"
      - "android/app/src/androidTest/**"
      - "desktop/src/sim/chunk_store.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: emulator (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      # The emulator needs the hardware acceleration of the runner (KVM), which the hosted Linux runners give to any user once allowed.
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the APK and its test
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: The game on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            adb logcat -c
            gradle --no-daemon :app:connectedDebugAndroidTest || { adb logcat -d > logcat.txt; exit 1; }

      - name: Upload the reports of the test
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-api-${{ matrix.api }}
          path: |
            android/logcat.txt
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  # The thread that generates the chunks ahead of time (spec 09, "Streaming"; item C4.1), under ThreadSanitizer: only the headless
  # libraries and their tests (CMake option AETHER_HEADLESS_ONLY), built by clang with the packages of Ubuntu, no vcpkg.
  thread-sanitizer:
    name: thread sanitizer (streaming)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Packages
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120"
          sudo timeout 300 apt-get $APT update || echo "some package lists did not refresh"
          sudo timeout 420 apt-get $APT install -y --no-install-recommends ninja-build clang catch2 nlohmann-json3-dev
      - name: Configure (clang, ThreadSanitizer, headless only)
        run: >-
          cmake -S desktop -B build-tsan -G Ninja -DAETHER_HEADLESS_ONLY=ON -DAETHER_WERROR=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-fsanitize=thread -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
      - name: Build the tests
        run: cmake --build build-tsan --target aether_tests
      # The kernels of the runners randomize memory more than ThreadSanitizer accepts ("unexpected memory mapping"): less of it.
      - name: The streaming under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          ./build-tsan/aether_tests "[streaming]"
